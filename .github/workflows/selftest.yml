name: RDAP selftest

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rdap-selftest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    name: A2A selftest (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q rdap.py team_agents
      - name: POSIX launcher smoke
        if: runner.os != 'Windows' && matrix.python == '3.10'
        run: bash ./rdap --help
      - name: Native Windows PowerShell 5.1 launcher smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: rdap.cmd --help
      - name: Native Windows PowerShell 7 launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\rdap.ps1 --help
      - name: Authentication, relay, cancellation, and transport selftests
        run: python -m team_agents.selftest
